controller_manager:
  ros__parameters:
    namespace: bicycle
    update_rate: 100  # Hz
    use_sim_time: True
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

position_controller:
  ros__parameters:
    joints:
      - steering_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
      - effort

velocity_controller:
  ros__parameters:
    joints:
      - rear_wheel_joint
      - front_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
      - effort
  

